name: Scan Polymarket

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: scan
  cancel-in-progress: false   # let a run finish rather than overlap with the next trigger

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8        # bumped from 4: two-pass fetch (see shared/polymarket_client.py)
                               # roughly doubles API calls and processing time per run. The
                               # concurrency block above means a slow run just delays the next
                               # trigger rather than overlapping it, so this is a safety margin,
                               # not a cadence guarantee.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m services.scan.scan
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DEFAULT_CHAT_ID: ${{ secrets.DEFAULT_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
